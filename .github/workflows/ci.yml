name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          npm-version: 11
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Check sitemap & robots output
        run: |
          test -f dist/sitemap-index.xml && echo "sitemap ✓"
          test -f dist/robots.txt && echo "robots ✓"
          test -f dist/index.html && echo "index ✓"
